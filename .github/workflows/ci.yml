name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'feat/**', 'fix/**', 'codex/**']
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Type Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Verify CLI binary
        run: node dist/cli.js --help

      - name: Verify lifecycle status CLI contracts and exits
        run: node scripts/verify-lifecycle-status-cli.mjs

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CTX_INSTANCE_ID: ci-test
      CTX_ORG: testorg
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Run unit tests
        if: runner.os != 'Windows'
        run: npm test -- --exclude tests/integration/phase5-performance.test.ts

      - name: Run Windows unit tests
        if: runner.os == 'Windows'
        run: npm test -- --exclude tests/integration/phase5-performance.test.ts --exclude tests/unit/platform/secret-permissions.test.ts

      # This file runs a real Windows PowerShell 5.1 ACL child. Isolate it from
      # the parallel worker pool so its unchanged 10-second timeout measures the
      # ACL operation rather than process/CPU contention from unrelated tests.
      - name: Run isolated Windows ACL tests
        if: runner.os == 'Windows'
        run: npx vitest run tests/unit/platform/secret-permissions.test.ts --maxWorkers=1 --no-file-parallelism

      # Wall-clock performance assertions must not share a hosted runner with
      # Vitest's parallel file workers: scheduler preemption is not product
      # latency. Keep the product thresholds unchanged and run the complete
      # performance file in its own single-worker process instead.
      - name: Run isolated performance tests
        run: npx vitest run tests/integration/phase5-performance.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Run codex parity tests
        run: npm run test:codex

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      # Build-only credentials. Configure CI_AUTH_SECRET and CI_ADMIN_PASSWORD
      # in repo settings (Settings > Secrets and variables > Actions) to override.
      # Fallback values are only used for local build/typecheck and must never
      # be used in production environments.
      AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || 'ci-fallback-do-not-use-in-prod' }}
      AUTH_TRUST_HOST: 'true'
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'ci-fallback' }}
      CTX_INSTANCE_ID: ci-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Type check dashboard
        run: npx tsc --noEmit

      - name: Build dashboard
        run: npm run build
